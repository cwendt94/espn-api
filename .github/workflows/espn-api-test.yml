name: Espn API Integration Test
on:
  schedule:
  # run once a day
    - cron:  '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set up uv
      uses: astral-sh/setup-uv@v4
    - name: Install dependencies
      run: uv sync --extra dev
    - name: Test integration
      run: |
        uv run pytest \
          tests/football/integration \
          tests/basketball/integration \
          tests/hockey/integration \
          tests/baseball/integration \
          tests/wbasketball/integration
